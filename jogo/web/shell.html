		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "VideoGame",
			"name": "Mike on Mars",
			"url": "https://out-of-space-exception.github.io/mike-on-mars/",
			"image": "https://out-of-space-exception.github.io/mike-on-mars/share.png",
			"description": "A free game for kids aged 7 to 12. Build Mike's base in Gale Crater, grow space plants, face solar storms from NASA data and collect 35 science cards.",
			"genre": ["Educational", "Simulation"],
			"gamePlatform": "Web browser",
			"applicationCategory": "Game",
			"operatingSystem": "Any",
			"inLanguage": ["en", "pt-BR", "es", "fr"],
			"isAccessibleForFree": true,
			"audience": {"@type": "PeopleAudience", "suggestedMinAge": 7, "suggestedMaxAge": 12},
			"author": {"@type": "Organization", "name": "Out of Space Exception"},

		<!--
			Página do Mike on Mars no navegador. Troca a tela de carregamento da Godot pela tela
			do Design (design/05-telas/tela-carregamento.png): Marte girando, a nave como barra de
			progresso e o rastro de constelação. A parte da Godot (script no fim) segue o modelo oficial.
		-->
		<style>
@font-face {
	font-family: 'Rubik';
	src: url('rubik.ttf') format('truetype');
	font-weight: 300 900;
	font-display: swap;
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: #f2d091;
	background: linear-gradient(#3a1418, #73242a);
	overflow: hidden;
	touch-action: none;
	font-family: 'Rubik', sans-serif;
}
#canvas {
	display: block;
	visibility: hidden;
}
#canvas:focus {
	outline: none;
}
#loader {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	z-index: 10;
	transition: opacity 0.6s ease;
}
#notice {
	position: fixed;
	left: 8%;
	right: 8%;
	bottom: 6%;
	z-index: 11;
	text-align: center;
	font-size: 16px;
	display: none;
}
		</style>
		$GODOT_HEAD_INCLUDE

	<body>
		<canvas id="canvas">
			Mike on Mars needs a browser that can draw on a canvas.
		</canvas>
		<noscript>
			Mike on Mars needs JavaScript to run. Please turn it on and reload the page.
		</noscript>

		<canvas id="loader"></canvas>
		<div id="notice"></div>

		<script>
// ───────────── Tela de carregamento (desenho do Design) ─────────────
const Loader = (() => {
	const COR = {fundo1: '#3a1418', fundo2: '#73242a', terracota: '#d96941', creme: '#f2d091', ouro: '#e8b23a'};
	const cv = document.getElementById('loader');
	const ctx = cv.getContext('2d');
	const nave = new Image();
	nave.src = 'nave.png';
	let W = 0, H = 0, alvo = 0, mostrado = 0, rodando = true;
	const rastro = [];
	let ultimaPonta = null;

	function ajustar() {
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth;
		H = window.innerHeight;
		cv.width = Math.round(W * dpr);
		cv.height = Math.round(H * dpr);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	window.addEventListener('resize', ajustar);
	ajustar();

	// Céu: estrelinhas que piscam.
	const estrelas = Array.from({length: 110}, () => ({x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.3, f: Math.random() * 6.28}));

	// Superfície de Marte: ruído com as cores da paleta, repetido na horizontal para girar sem emenda.
	const TW = 256, TH = 128;
	const textura = document.createElement('canvas');
	textura.width = TW * 2;
	textura.height = TH;
	(() => {
		const hash = (x, y) => {
			let n = (x * 374761393 + y * 668265263) | 0;
			n = Math.imul(n ^ (n >>> 13), 1274126177);
			return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
		};
		const suave = (t) => t * t * (3 - 2 * t);
		const ruido = (x, y, periodo) => {
			const xi = Math.floor(x), yi = Math.floor(y), u = suave(x - xi), v = suave(y - yi);
			const h = (a, b) => hash(((a % periodo) + periodo) % periodo, b);
			const a = h(xi, yi) * (1 - u) + h(xi + 1, yi) * u;
			const b = h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u;
			return a * (1 - v) + b * v;
		};
		const tctx = textura.getContext('2d');
		const img = tctx.createImageData(TW, TH);
		const tons = [[122, 38, 36], [201, 86, 47], [224, 122, 69], [240, 176, 122]];
		for (let y = 0; y < TH; y++) {
			for (let x = 0; x < TW; x++) {
				const n = 0.5 * ruido(x / 32, y / 32, TW / 32) + 0.3 * ruido(x / 16, y / 16, TW / 16) + 0.2 * ruido(x / 8, y / 8, TW / 8);
				const c = tons[n < 0.42 ? 0 : n < 0.52 ? 1 : n < 0.64 ? 2 : 3];
				const i = (y * TW + x) * 4;
				img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
			}
		}
		tctx.putImageData(img, 0, 0);
		tctx.putImageData(img, TW, 0);
	})();

	function marte(t) {
		const cx = W / 2, cy = H * 0.47, R = Math.min(W * 0.23, H * 0.13);
		// brilho dourado em volta
		const halo = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.35);
		halo.addColorStop(0, 'rgba(232,178,58,0.35)');
		halo.addColorStop(1, 'rgba(232,178,58,0)');
		ctx.fillStyle = halo;
		ctx.beginPath(); ctx.arc(cx, cy, R * 1.35, 0, Math.PI * 2); ctx.fill();
		// superfície girando
		ctx.save();
		ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
		const giro = (t * 10) % TW;
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(textura, giro, 0, TW, TH, cx - R * 1.6, cy - R, R * 3.2, R * 2);
		// sombra de esfera
		const sombra = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
		sombra.addColorStop(0, 'rgba(255,220,170,0.18)');
		sombra.addColorStop(0.65, 'rgba(0,0,0,0)');
		sombra.addColorStop(1, 'rgba(40,8,10,0.55)');
		ctx.fillStyle = sombra;
		ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
		ctx.restore();
		ctx.strokeStyle = 'rgba(232,178,58,0.75)';
		ctx.lineWidth = 2;
		ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
	}

	function estrelaDourada(x, y, tam, alfa) {
		const g = ctx.createRadialGradient(x, y, 0, x, y, tam * 3);
		g.addColorStop(0, `rgba(232,178,58,${0.55 * alfa})`);
		g.addColorStop(1, 'rgba(232,178,58,0)');
		ctx.fillStyle = g;
		ctx.beginPath(); ctx.arc(x, y, tam * 3, 0, Math.PI * 2); ctx.fill();
		ctx.strokeStyle = `rgba(255,240,200,${alfa})`;
		ctx.lineWidth = 1.2;
		ctx.beginPath();
		ctx.moveTo(x - tam * 1.6, y); ctx.lineTo(x + tam * 1.6, y);
		ctx.moveTo(x, y - tam * 1.6); ctx.lineTo(x, y + tam * 1.6);
		ctx.stroke();
	}

	function quadro(ms) {
		if (!rodando) return;
		const t = ms / 1000;
		mostrado += (alvo - mostrado) * 0.08;
		const fundo = ctx.createLinearGradient(0, 0, 0, H);
		fundo.addColorStop(0, COR.fundo1);
		fundo.addColorStop(1, COR.fundo2);
		ctx.fillStyle = fundo;
		ctx.fillRect(0, 0, W, H);
		for (const e of estrelas) {
			ctx.fillStyle = `rgba(242,208,145,${0.25 + 0.25 * Math.sin(t * 1.5 + e.f)})`;
			ctx.beginPath(); ctx.arc(e.x * W, e.y * H, e.r, 0, Math.PI * 2); ctx.fill();
		}
		// título
		const tamTitulo = Math.round(Math.min(W * 0.085, H * 0.05));
		ctx.fillStyle = COR.creme;
		ctx.textAlign = 'center';
		ctx.textBaseline = 'middle';
		ctx.font = `700 ${tamTitulo}px Rubik, sans-serif`;
		ctx.fillText('Mike on Mars', W / 2, H * 0.15);
		ctx.fillStyle = COR.ouro;
		ctx.fillRect(W / 2 - W * 0.14, H * 0.15 + tamTitulo * 0.85, W * 0.28, 3);

		marte(t);

		// barra de progresso
		const x0 = W * 0.14, x1 = W * 0.86, alt = Math.max(14, Math.min(W, H * 0.56) * 0.04), y = H * 0.8;
		const ponta = x0 + (x1 - x0) * Math.min(1, mostrado);
		ctx.save();
		ctx.beginPath(); ctx.roundRect(x0, y - alt / 2, x1 - x0, alt, alt / 2); ctx.clip();
		ctx.fillStyle = 'rgba(30,8,10,0.55)';
		ctx.fillRect(x0, y - alt / 2, x1 - x0, alt);
		const enche = ctx.createLinearGradient(x0, 0, x1, 0);
		enche.addColorStop(0, COR.terracota);
		enche.addColorStop(1, COR.ouro);
		ctx.fillStyle = enche;
		ctx.fillRect(x0, y - alt / 2, ponta - x0, alt);
		ctx.restore();
		ctx.strokeStyle = COR.ouro;
		ctx.lineWidth = 2;
		ctx.beginPath(); ctx.roundRect(x0, y - alt / 2, x1 - x0, alt, alt / 2); ctx.stroke();

		// rastro de constelação atrás da nave
		if (!ultimaPonta || ponta - ultimaPonta > 9) {
			rastro.push({x: ponta - Math.random() * 6, y: y - alt * 0.9 + (Math.random() - 0.5) * alt * 1.6, nasceu: t});
			ultimaPonta = ponta;
		}
		while (rastro.length && t - rastro[0].nasceu > 1.6) rastro.shift();
		for (let i = 1; i < rastro.length; i++) {
			const a = 1 - (t - rastro[i - 1].nasceu) / 1.6;
			ctx.strokeStyle = `rgba(232,178,58,${0.5 * a})`;
			ctx.lineWidth = 1;
			ctx.beginPath(); ctx.moveTo(rastro[i - 1].x, rastro[i - 1].y); ctx.lineTo(rastro[i].x, rastro[i].y); ctx.stroke();
		}
		for (const s of rastro) estrelaDourada(s.x, s.y, 2.4, 1 - (t - s.nasceu) / 1.6);

		// a nave
		if (nave.complete && nave.naturalWidth) {
			const nw = Math.min(W, H * 0.56) * 0.16, nh = nw * nave.naturalHeight / nave.naturalWidth;
			ctx.drawImage(nave, ponta - nw * 0.45, y - nh * 0.62 + Math.sin(t * 4) * 1.5, nw, nh);
		}

		// porcentagem
		ctx.fillStyle = COR.creme;
		ctx.font = `700 ${Math.round(tamTitulo * 0.5)}px Rubik, sans-serif`;
		ctx.fillText(`${Math.round(Math.min(1, mostrado) * 100)}%`, W / 2, y + alt + tamTitulo * 0.7);
		requestAnimationFrame(quadro);
	}
	requestAnimationFrame(quadro);

	return {
		progresso(p) { alvo = Math.max(alvo, Math.min(1, p)); },
		pronto() {
			alvo = 1;
			document.getElementById('canvas').style.visibility = 'visible';
			setTimeout(() => {
				cv.style.opacity = '0';
				setTimeout(() => { rodando = false; cv.remove(); }, 650);
			}, 350);
		},
		erro(texto) {
			const n = document.getElementById('notice');
			n.textContent = texto;
			n.style.display = 'block';
		},
	};
})();
		</script>

		<script src="$GODOT_URL"></script>
		<script>
// ───────────── Godot (igual ao modelo oficial, só que usando a tela acima) ─────────────
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	function displayFailureNotice(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		Loader.erro('Oops! The game could not start. Try another browser. (' + msg + ')');
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Missing: ' + missing.join(', '));
		return;
	}
	// Enquanto o tamanho total não chega, a barra anda devagar sozinha.
	let lento = 0;
	const espera = setInterval(() => { lento = Math.min(0.3, lento + 0.01); Loader.progresso(lento); }, 200);
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				Loader.progresso(0.05 + 0.9 * (current / total));
			}
		},
	}).then(() => {
		clearInterval(espera);
		Loader.pronto();
	}, (err) => {
		clearInterval(espera);
		displayFailureNotice(err);
	});
}());
		</script>
	</body>
</html>
