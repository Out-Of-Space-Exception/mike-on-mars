<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#3a1418">

		<meta name="description" content="A free game for kids aged 7 to 12. Build Mike's base in Gale Crater, grow space plants, face solar storms from NASA data and collect 35 science cards. Plays in the browser in English, Portuguese, Spanish and French.">

		<link rel="icon" href="index.icon.png">

		<meta property="og:title" content="Mike on Mars: build a base on Mars and learn with NASA">
		<meta property="og:description" content="Build a base on Mars, grow plants and survive solar storms from NASA data. A free science game for kids aged 7 to 12.">
		<meta property="og:url" content="https://out-of-space-exception.github.io/mike-on-mars/">
		<meta property="og:image" content="https://out-of-space-exception.github.io/mike-on-mars/share.png">

		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "VideoGame",
			"name": "Mike on Mars",
			"url": "https://out-of-space-exception.github.io/mike-on-mars/",
			"image": "https://out-of-space-exception.github.io/mike-on-mars/share.png",
			"description": "A free game for kids aged 7 to 12. Build Mike's base in Gale Crater, grow space plants, face solar storms from NASA data and collect 35 science cards.",
			"genre": ["Educational", "Simulation"],
			"gamePlatform": "Web browser",
			"applicationCategory": "Game",
			"operatingSystem": "Any",
			"inLanguage": ["en", "pt-BR", "es", "fr"],
			"isAccessibleForFree": true,
			"audience": {"@type": "PeopleAudience", "suggestedMinAge": 7, "suggestedMaxAge": 12},
			"author": {"@type": "Organization", "name": "Out of Space Exception"},
			"about": ["Mars", "Gale Crater", "Space weather", "Plants in space", "NASA"]
		}
		</script>
		<!--
			Mike on Mars page in the browser. Replaces the Godot loading screen with the Design
			screen (design/05-telas/tela-carregamento.png): spinning Mars, the ship as a progress bar and
			the constellation trail. The Godot part (script at the end) follows the official template.
		-->
		<style>
@font-face {
	font-family: 'Rubik';
	src: url('rubik.ttf') format('truetype');
	font-weight: 300 900;
	font-display: swap;
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: #f2d091;
	background: linear-gradient(#3a1418, #73242a);
	overflow: hidden;
	touch-action: none;
	font-family: 'Rubik', sans-serif;
}
#canvas {
	display: block;
	visibility: hidden;
}
#canvas:focus {
	outline: none;
}
#loader {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	z-index: 10;
	transition: opacity 0.6s ease;
}
#notice {
	position: fixed;
	left: 8%;
	right: 8%;
	bottom: 6%;
	z-index: 11;
	text-align: center;
	font-size: 16px;
	display: none;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Mike on Mars needs a browser that can draw on a canvas.
		</canvas>
		<noscript>
			Mike on Mars needs JavaScript to run. Please turn it on and reload the page.
		</noscript>

		<canvas id="loader"></canvas>
		<div id="notice"></div>

		<script>
// ───────────── Loading screen (Design drawing) ─────────────
const Loader = (() => {
	const COLORS = {bg1: '#3a1418', bg2: '#73242a', terracotta: '#d96941', cream: '#f2d091', gold: '#e8b23a'};
	const cv = document.getElementById('loader');
	const ctx = cv.getContext('2d');
	const ship = new Image();
	ship.src = 'nave.png';
	let W = 0, H = 0, target = 0, shown = 0, running = true;
	const trail = [];
	let lastTip = null;

	function resize() {
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth;
		H = window.innerHeight;
		cv.width = Math.round(W * dpr);
		cv.height = Math.round(H * dpr);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	window.addEventListener('resize', resize);
	resize();

	// Sky: twinkling little stars.
	const stars = Array.from({length: 110}, () => ({x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.3, f: Math.random() * 6.28}));

	// Mars surface: noise with the palette colors, repeated horizontally to spin without a seam.
	const TW = 256, TH = 128;
	const texture = document.createElement('canvas');
	texture.width = TW * 2;
	texture.height = TH;
	(() => {
		const hash = (x, y) => {
			let n = (x * 374761393 + y * 668265263) | 0;
			n = Math.imul(n ^ (n >>> 13), 1274126177);
			return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
		};
		const smooth = (t) => t * t * (3 - 2 * t);
		const noise = (x, y, period) => {
			const xi = Math.floor(x), yi = Math.floor(y), u = smooth(x - xi), v = smooth(y - yi);
			const h = (a, b) => hash(((a % period) + period) % period, b);
			const a = h(xi, yi) * (1 - u) + h(xi + 1, yi) * u;
			const b = h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u;
			return a * (1 - v) + b * v;
		};
		const tctx = texture.getContext('2d');
		const img = tctx.createImageData(TW, TH);
		const tones = [[122, 38, 36], [201, 86, 47], [224, 122, 69], [240, 176, 122]];
		for (let y = 0; y < TH; y++) {
			for (let x = 0; x < TW; x++) {
				const n = 0.5 * noise(x / 32, y / 32, TW / 32) + 0.3 * noise(x / 16, y / 16, TW / 16) + 0.2 * noise(x / 8, y / 8, TW / 8);
				const c = tones[n < 0.42 ? 0 : n < 0.52 ? 1 : n < 0.64 ? 2 : 3];
				const i = (y * TW + x) * 4;
				img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
			}
		}
		tctx.putImageData(img, 0, 0);
		tctx.putImageData(img, TW, 0);
	})();

	function drawMars(t) {
		const cx = W / 2, cy = H * 0.47, R = Math.min(W * 0.23, H * 0.13);
		// golden glow around
		const halo = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.35);
		halo.addColorStop(0, 'rgba(232,178,58,0.35)');
		halo.addColorStop(1, 'rgba(232,178,58,0)');
		ctx.fillStyle = halo;
		ctx.beginPath(); ctx.arc(cx, cy, R * 1.35, 0, Math.PI * 2); ctx.fill();
		// spinning surface
		ctx.save();
		ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
		const spin = (t * 10) % TW;
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(texture, spin, 0, TW, TH, cx - R * 1.6, cy - R, R * 3.2, R * 2);
		// sphere shading
		const shade = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
		shade.addColorStop(0, 'rgba(255,220,170,0.18)');
		shade.addColorStop(0.65, 'rgba(0,0,0,0)');
		shade.addColorStop(1, 'rgba(40,8,10,0.55)');
		ctx.fillStyle = shade;
		ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
		ctx.restore();
		ctx.strokeStyle = 'rgba(232,178,58,0.75)';
		ctx.lineWidth = 2;
		ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
	}

	function goldStar(x, y, size, alpha) {
		const g = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
		g.addColorStop(0, `rgba(232,178,58,${0.55 * alpha})`);
		g.addColorStop(1, 'rgba(232,178,58,0)');
		ctx.fillStyle = g;
		ctx.beginPath(); ctx.arc(x, y, size * 3, 0, Math.PI * 2); ctx.fill();
		ctx.strokeStyle = `rgba(255,240,200,${alpha})`;
		ctx.lineWidth = 1.2;
		ctx.beginPath();
		ctx.moveTo(x - size * 1.6, y); ctx.lineTo(x + size * 1.6, y);
		ctx.moveTo(x, y - size * 1.6); ctx.lineTo(x, y + size * 1.6);
		ctx.stroke();
	}

	function frame(ms) {
		if (!running) return;
		const t = ms / 1000;
		shown += (target - shown) * 0.08;
		const background = ctx.createLinearGradient(0, 0, 0, H);
		background.addColorStop(0, COLORS.bg1);
		background.addColorStop(1, COLORS.bg2);
		ctx.fillStyle = background;
		ctx.fillRect(0, 0, W, H);
		for (const e of stars) {
			ctx.fillStyle = `rgba(242,208,145,${0.25 + 0.25 * Math.sin(t * 1.5 + e.f)})`;
			ctx.beginPath(); ctx.arc(e.x * W, e.y * H, e.r, 0, Math.PI * 2); ctx.fill();
		}
		// title
		const titleSize = Math.round(Math.min(W * 0.085, H * 0.05));
		ctx.fillStyle = COLORS.cream;
		ctx.textAlign = 'center';
		ctx.textBaseline = 'middle';
		ctx.font = `700 ${titleSize}px Rubik, sans-serif`;
		ctx.fillText('Mike on Mars', W / 2, H * 0.15);
		ctx.fillStyle = COLORS.gold;
		ctx.fillRect(W / 2 - W * 0.14, H * 0.15 + titleSize * 0.85, W * 0.28, 3);

		drawMars(t);

		// progress bar
		const x0 = W * 0.14, x1 = W * 0.86, barHeight = Math.max(14, Math.min(W, H * 0.56) * 0.04), y = H * 0.8;
		const tip = x0 + (x1 - x0) * Math.min(1, shown);
		ctx.save();
		ctx.beginPath(); ctx.roundRect(x0, y - barHeight / 2, x1 - x0, barHeight, barHeight / 2); ctx.clip();
		ctx.fillStyle = 'rgba(30,8,10,0.55)';
		ctx.fillRect(x0, y - barHeight / 2, x1 - x0, barHeight);
		const fillGradient = ctx.createLinearGradient(x0, 0, x1, 0);
		fillGradient.addColorStop(0, COLORS.terracotta);
		fillGradient.addColorStop(1, COLORS.gold);
		ctx.fillStyle = fillGradient;
		ctx.fillRect(x0, y - barHeight / 2, tip - x0, barHeight);
		ctx.restore();
		ctx.strokeStyle = COLORS.gold;
		ctx.lineWidth = 2;
		ctx.beginPath(); ctx.roundRect(x0, y - barHeight / 2, x1 - x0, barHeight, barHeight / 2); ctx.stroke();

		// constellation trail behind the ship
		if (!lastTip || tip - lastTip > 9) {
			trail.push({x: tip - Math.random() * 6, y: y - barHeight * 0.9 + (Math.random() - 0.5) * barHeight * 1.6, born: t});
			lastTip = tip;
		}
		while (trail.length && t - trail[0].born > 1.6) trail.shift();
		for (let i = 1; i < trail.length; i++) {
			const a = 1 - (t - trail[i - 1].born) / 1.6;
			ctx.strokeStyle = `rgba(232,178,58,${0.5 * a})`;
			ctx.lineWidth = 1;
			ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
		}
		for (const s of trail) goldStar(s.x, s.y, 2.4, 1 - (t - s.born) / 1.6);

		// the ship
		if (ship.complete && ship.naturalWidth) {
			const nw = Math.min(W, H * 0.56) * 0.16, nh = nw * ship.naturalHeight / ship.naturalWidth;
			ctx.drawImage(ship, tip - nw * 0.45, y - nh * 0.62 + Math.sin(t * 4) * 1.5, nw, nh);
		}

		// percentage
		ctx.fillStyle = COLORS.cream;
		ctx.font = `700 ${Math.round(titleSize * 0.5)}px Rubik, sans-serif`;
		ctx.fillText(`${Math.round(Math.min(1, shown) * 100)}%`, W / 2, y + barHeight + titleSize * 0.7);
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);

	return {
		progress(p) { target = Math.max(target, Math.min(1, p)); },
		ready() {
			target = 1;
			document.getElementById('canvas').style.visibility = 'visible';
			setTimeout(() => {
				cv.style.opacity = '0';
				setTimeout(() => { running = false; cv.remove(); }, 650);
			}, 350);
		},
		error(text) {
			const n = document.getElementById('notice');
			n.textContent = text;
			n.style.display = 'block';
		},
	};
})();
		</script>

		<script src="$GODOT_URL"></script>
		<script>
// ───────────── Godot (same as the official template, but using the screen above) ─────────────
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	function displayFailureNotice(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		Loader.error('Oops! The game could not start. Try another browser. (' + msg + ')');
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Missing: ' + missing.join(', '));
		return;
	}
	// Until the total size arrives, the bar moves slowly on its own.
	let slow = 0;
	const waiting = setInterval(() => { slow = Math.min(0.3, slow + 0.01); Loader.progress(slow); }, 200);
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				Loader.progress(0.05 + 0.9 * (current / total));
			}
		},
	}).then(() => {
		clearInterval(waiting);
		Loader.ready();
	}, (err) => {
		clearInterval(waiting);
		displayFailureNotice(err);
	});
}());
		</script>
	</body>
</html>
